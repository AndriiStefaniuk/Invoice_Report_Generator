<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="pageTitle">Report Details - Chuhax</title>
  <script>
    try {
      var savedTheme = localStorage.getItem("theme");
      if (!savedTheme) {
        savedTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", savedTheme);
    } catch (e) {}
  </script>
  <style>
    :root {
      --bg-color: #E8DECF;
      --primary-blue: #0B2A4A;
      --card-bg: rgba(255, 255, 255, 0.45);
      --border-color: #5A6D80;
      --border-light: rgba(90, 109, 128, 0.25);
      --text-muted: #4A5B6D;
      --btn-bg: #0B2A4A;
      --btn-text: #ffffff;
      --btn-hover: #081f38;
      --accent-pill: rgba(11, 42, 74, 0.08);
      --btn-download-bg: #0B2A4A;
      --btn-download-text: #ffffff;
      --btn-download-border: #0B2A4A;
      --btn-download-hover-bg: #081f38;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg-color: #101820;
      --primary-blue: #E8DECF;
      --card-bg: rgba(255, 255, 255, 0.05);
      --border-color: #7F93A8;
      --border-light: rgba(127, 147, 168, 0.2);
      --text-muted: #B5C2CF;
      --btn-bg: #E8DECF;
      --btn-text: #0B2A4A;
      --btn-hover: #d8cdbd;
      --accent-pill: rgba(232, 222, 207, 0.12);
      --btn-download-bg: rgba(232, 222, 207, 0.1);
      --btn-download-text: #E8DECF;
      --btn-download-border: #7F93A8;
      --btn-download-hover-bg: rgba(232, 222, 207, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--primary-blue);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Top Navigation */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-light);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      text-decoration: none;
      color: var(--primary-blue);
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      transition: transform 0.1s ease;
    }

    .back-btn:hover {
      transform: translateX(-2px);
    }

    .nav-title {
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Toolbar: Language & Theme */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar button {
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 3px;
      height: 28px;
      color: var(--primary-blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease;
    }

    .toolbar button:hover {
      border-color: var(--primary-blue);
    }

    .lang-btn {
      width: 38px;
    }

    .lang-btn svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 3px;
    }

    .lang-btn[aria-pressed="true"] {
      outline: 2px solid var(--primary-blue);
      outline-offset: 1px;
    }

    .theme-btn {
      width: 34px;
      margin-left: 2px;
    }

    .theme-btn .icon-sun { display: none; }
    :root[data-theme="dark"] .theme-btn .icon-sun { display: block; }
    :root[data-theme="dark"] .theme-btn .icon-moon { display: none; }

    /* Main Content */
    .content {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 20px;
    }

    /* Date Range Navigator */
    .date-navigator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 30px;
      padding: 6px 14px;
    }

    .nav-arrow {
      background: none;
      border: none;
      color: var(--primary-blue);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 10px;
      line-height: 1;
      border-radius: 50%;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .nav-arrow:hover {
      background-color: var(--accent-pill);
    }

    .nav-arrow:active {
      transform: scale(0.9);
    }

    .date-range-text {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Section Cards */
    .report-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.75px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* Site Addresses */
    .site-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .site-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 500;
    }

    .site-pin {
      font-size: 14px;
      opacity: 0.8;
    }

    /* Work Breakdown */
    .breakdown-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }

    .breakdown-row:last-of-type {
      border-bottom: none;
      padding-bottom: 0;
    }

    .breakdown-title {
      font-size: 15px;
      font-weight: 600;
    }

    .breakdown-dates {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .breakdown-hours {
      font-size: 15px;
      font-weight: 700;
      background-color: var(--accent-pill);
      padding: 4px 10px;
      border-radius: 8px;
    }

    /* Total Earnings Summary Card */
    .total-banner {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total-title {
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .total-amount {
      font-size: 26px;
      font-weight: 800;
    }

    /* Download Action Button */
    .btn-download {
      width: 100%;
      padding: 16px;
      background-color: var(--btn-download-bg);
      color: var(--btn-download-text);
      border: 1px solid var(--btn-download-border);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transition: background-color 0.2s ease, transform 0.1s ease, border-color 0.2s ease;
      margin-top: 8px;
    }

    .btn-download svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-download:hover {
      background-color: var(--btn-download-hover-bg);
      border-color: var(--primary-blue);
    }

    .btn-download:active {
      transform: translateY(2px);
    }

    @media (max-width: 480px) {
      .top-nav {
        padding: 14px 16px;
      }
      .content {
        padding: 16px;
      }
    }
  </style>
</head>
<body>

<div class="app-container">

  <header class="top-nav">
    <div class="nav-left">
      <a href="main.html" class="back-btn" data-translate-aria-label="backButtonAria" aria-label="Back to Dashboard">&larr;</a>
      <div class="nav-title" data-translate="navTitle">Report Details</div>
    </div>

    <div class="toolbar">
      <div class="lang-group" role="group" data-translate-aria-label="languageGroup" style="display:flex; gap:6px;">
        <button type="button" class="lang-btn" data-lang="en" aria-label="English" title="English">
          <svg viewBox="0 0 60 30" preserveAspectRatio="none" aria-hidden="true">
            <clipPath id="unionJackFrame"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
            <clipPath id="unionJackDiagonals"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
            <g clip-path="url(#unionJackFrame)">
              <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
              <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
              <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#unionJackDiagonals)" stroke="#C8102E" stroke-width="4"/>
              <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
              <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
            </g>
          </svg>
        </button>
        <button type="button" class="lang-btn" data-lang="fr" aria-label="Français" title="Français">
          <svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true">
            <rect width="1" height="2" fill="#002654"/>
            <rect x="1" width="1" height="2" fill="#ffffff"/>
            <rect x="2" width="1" height="2" fill="#CE1126"/>
          </svg>
        </button>
        <button type="button" class="lang-btn" data-lang="uk" aria-label="Українська" title="Українська">
          <svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true">
            <rect width="3" height="1" fill="#0057B7"/>
            <rect y="1" width="3" height="1" fill="#FFD700"/>
          </svg>
        </button>
      </div>

      <button type="button" class="theme-btn" id="themeToggle" data-translate-aria-label="themeButtonLabel" data-translate-title="themeButtonLabel">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="content">

    <!-- Date Range Switcher -->
    <div class="date-navigator">
      <button type="button" class="nav-arrow" id="btnPrevReport" aria-label="Previous Report">&larr;</button>
      <div class="date-range-text" id="reportDateRange"></div>
      <button type="button" class="nav-arrow" id="btnNextReport" aria-label="Next Report">&rarr;</button>
    </div>

    <!-- Site Addresses Card -->
    <div class="report-card">
      <div class="section-label" data-translate="sitesHeader">Site Address(es)</div>
      <ul class="site-list" id="siteAddressesList">
        <!-- Rendered dynamically -->
      </ul>
    </div>

    <!-- Hours Breakdown Card -->
    <div class="report-card">
      <div class="section-label" data-translate="hoursHeader">Hours Worked</div>

      <div class="breakdown-row">
        <div>
          <div class="breakdown-title" data-translate="week1Label">Week 1</div>
          <div class="breakdown-dates" id="week1DateRange"></div>
        </div>
        <div class="breakdown-hours"><span id="week1HoursVal">0</span> <span data-translate="unitHours">Hours</span></div>
      </div>

      <div class="breakdown-row">
        <div>
          <div class="breakdown-title" data-translate="week2Label">Week 2</div>
          <div class="breakdown-dates" id="week2DateRange"></div>
        </div>
        <div class="breakdown-hours"><span id="week2HoursVal">0</span> <span data-translate="unitHours">Hours</span></div>
      </div>
    </div>

    <!-- Total Earned Card -->
    <div class="total-banner">
      <div class="total-title" data-translate="totalEarnedHeader">Total Earned</div>
      <div class="total-amount" id="totalEarnedVal">$0.00</div>
    </div>

    <!-- Action Button with Vector SVG -->
    <button type="button" class="btn-download" id="downloadReportBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span data-translate="btnDownload">Download Report (.xlsx)</span>
    </button>

  </main>
</div>

<script type="module" src="../JavaScript/reports/previous-reports-themes-language.js"></script>
</body>
</html>
