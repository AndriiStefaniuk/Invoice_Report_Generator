<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="pageTitle">Enter Verification Code - Chuhax</title>
  <script>
    try {
      var savedTheme = localStorage.getItem("theme");
      if (!savedTheme) {
        savedTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", savedTheme);
    } catch (e) {}
  </script>
  <style>
    :root {
      --bg-color: #E8DECF;
      --primary-blue: #0B2A4A;
      --input-bg: rgba(255, 255, 255, 0.4);
      --border-color: #5A6D80;
      --rule-neutral: #4A5B6D;
      --rule-valid: #1E6B37;
      --rule-invalid: #A62A2A;
      --input-text: #333333;
      --btn-bg: #0B2A4A;
      --btn-text: #ffffff;
      --btn-hover: #081f38;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg-color: #101820;
      --primary-blue: #E8DECF;
      --input-bg: rgba(255, 255, 255, 0.07);
      --border-color: #7F93A8;
      --rule-neutral: #B5C2CF;
      --rule-valid: #6FD08C;
      --rule-invalid: #FF8A8A;
      --input-text: #F1ECE2;
      --btn-bg: #E8DECF;
      --btn-text: #0B2A4A;
      --btn-hover: #d8cdbd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--primary-blue);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top navigation bar */
    .top-bar {
      width: 100%;
      padding: 20px 24px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar button {
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 3px;
      height: 28px;
      color: var(--primary-blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .lang-btn {
      width: 38px;
    }

    .lang-btn svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 3px;
    }

    .lang-btn[aria-pressed="true"] {
      outline: 2px solid var(--primary-blue);
      outline-offset: 1px;
    }

    .theme-btn {
      width: 34px;
      margin-left: 4px;
    }

    .theme-btn .icon-sun { display: none; }
    :root[data-theme="dark"] .theme-btn .icon-sun { display: block; }
    :root[data-theme="dark"] .theme-btn .icon-moon { display: none; }

    /* Content area anchored higher up */
    .main-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 80px 20px 40px 20px; /* Pushes content down slightly from header, but keeps it in upper half */
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo-container {
      margin-bottom: 24px;
    }

    .logo {
      max-width: 130px;
      height: auto;
      object-fit: contain;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 12px 0;
      font-weight: 700;
    }

    .subtitle {
      font-size: 15px;
      color: var(--rule-neutral);
      margin: 0 0 32px 0;
      line-height: 1.5;
    }

    .subtitle span {
      font-weight: 700;
      color: var(--primary-blue);
      word-break: break-all;
    }

    /* Simple, robust code box layout */
    .code-container {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 32px;
    }

    .code-input {
      width: 100%;
      max-width: 52px;
      height: 58px;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--input-bg);
      color: var(--input-text);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .code-input:focus {
      border-color: var(--primary-blue);
      border-width: 2px;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 28px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
      background-color: var(--btn-hover);
    }

    .btn-submit:active {
      transform: translateY(2px);
    }

    .resend-container {
      margin-top: 24px;
      font-size: 14px;
      color: var(--rule-neutral);
    }

    .resend-link {
      color: var(--primary-blue);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .resend-link:hover {
      text-decoration: underline;
    }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      .top-bar {
        padding: 14px 16px;
      }
      .main-wrapper {
        padding: 30px 16px 30px 16px;
      }
      .logo {
        max-width: 110px;
      }
      h1 {
        font-size: 20px;
      }
      .subtitle {
        font-size: 13px;
        margin-bottom: 24px;
      }
      .code-input {
        height: 50px;
        font-size: 20px;
      }
      .code-container {
        gap: 6px;
      }
    }
  </style>
</head>
<body>

<header class="top-bar">
  <div class="toolbar">
    <div class="lang-group" role="group" data-translate-aria-label="languageGroup" style="display:flex; gap:6px;">
      <button type="button" class="lang-btn" data-lang="en" aria-label="English" title="English">
        <svg viewBox="0 0 60 30" preserveAspectRatio="none" aria-hidden="true">
          <clipPath id="unionJackFrame"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
          <clipPath id="unionJackDiagonals"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
          <g clip-path="url(#unionJackFrame)">
            <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
            <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#unionJackDiagonals)" stroke="#C8102E" stroke-width="4"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
          </g>
        </svg>
      </button>
      <button type="button" class="lang-btn" data-lang="fr" aria-label="Français" title="Français">
        <svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true">
          <rect width="1" height="2" fill="#002654"/>
          <rect x="1" width="1" height="2" fill="#ffffff"/>
          <rect x="2" width="1" height="2" fill="#CE1126"/>
        </svg>
      </button>
      <button type="button" class="lang-btn" data-lang="uk" aria-label="Українська" title="Українська">
        <svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true">
          <rect width="3" height="1" fill="#0057B7"/>
          <rect y="1" width="3" height="1" fill="#FFD700"/>
        </svg>
      </button>
    </div>

    <button type="button" class="theme-btn" id="themeToggle" data-translate-aria-label="themeButtonLabel" data-translate-title="themeButtonLabel">
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>
</header>

<main class="main-wrapper">
  <div class="container">
    <div class="logo-container">
      <img src="/images_temporary/logo.png" alt="Logo" class="logo">
    </div>

    <h1 data-translate="heading">Enter Confirmation Code</h1>
    <div class="subtitle">
      <span data-translate="subtitleText">We have sent a 6-digit verification code to</span><br>
      <span id="userEmailDisplay">user@example.com</span>
    </div>

    <div class="code-container">
      <input type="text" class="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" enterkeyhint="next">
      <input type="text" class="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="1" enterkeyhint="next">
      <input type="text" class="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="1" enterkeyhint="next">
      <input type="text" class="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="1" enterkeyhint="next">
      <input type="text" class="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="1" enterkeyhint="next">
      <input type="text" class="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="1" enterkeyhint="done">
    </div>

    <button type="button" class="btn-submit" onclick="verifyCodeAction()" data-translate="verifyButton">Verify Code</button>

    <div class="resend-container">
      <span data-translate="resendPrompt">Didn't receive the code?</span> <a class="resend-link" onclick="resendCode()" data-translate="resendLink">Resend</a>
    </div>
  </div>
</main>

<script type="module" src="../JavaScript/email-verification/verify-code.js"></script>
</body>
</html>
