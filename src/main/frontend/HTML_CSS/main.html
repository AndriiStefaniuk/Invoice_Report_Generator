<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="pageTitle">Dashboard - Chuhax</title>
  <script>
    try {
      var savedTheme = localStorage.getItem("theme");
      if (!savedTheme) {
        savedTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", savedTheme);
    } catch (e) {}
  </script>
  <style>
    :root {
      --bg-color: #E8DECF;
      --primary-blue: #0B2A4A;
      --card-bg: rgba(255, 255, 255, 0.55);
      --card-border: #7F93A8;
      --card-hover-border: #0B2A4A;
      --card-hover-bg: rgba(255, 255, 255, 0.85);
      --card-icon-badge: rgba(11, 42, 74, 0.08);
      --text-muted: #4A5B6D;
      --border-color: #5A6D80;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg-color: #101820;
      --primary-blue: #E8DECF;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(127, 147, 168, 0.35);
      --card-hover-border: #E8DECF;
      --card-hover-bg: rgba(255, 255, 255, 0.08);
      --card-icon-badge: rgba(232, 222, 207, 0.08);
      --text-muted: #B5C2CF;
      --border-color: #7F93A8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--primary-blue);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top navigation toolbar */
    .top-bar {
      width: 100%;
      padding: 18px 24px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar button {
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 3px;
      height: 28px;
      color: var(--primary-blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease;
    }

    .toolbar button:hover {
      border-color: var(--primary-blue);
    }

    .lang-btn {
      width: 38px;
    }

    .lang-btn svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 3px;
    }

    .lang-btn[aria-pressed="true"] {
      outline: 2px solid var(--primary-blue);
      outline-offset: 1px;
    }

    .theme-btn {
      width: 34px;
      margin-left: 4px;
    }

    .theme-btn .icon-sun { display: none; }
    :root[data-theme="dark"] .theme-btn .icon-sun { display: block; }
    :root[data-theme="dark"] .theme-btn .icon-moon { display: none; }

    /* Dashboard Layout */
    .main-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 24px 60px 24px;
    }

    .container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-section {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      max-width: 150px;
      height: auto;
      object-fit: contain;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 26px;
      margin: 0 0 8px 0;
      font-weight: 700;
    }

    .greeting {
      font-size: 16px;
      color: var(--text-muted);
      margin: 0;
    }

    /* Action Cards Grid */
    .action-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .action-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: var(--primary-blue);
      transition: transform 0.18s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }

    .action-card:hover {
      transform: translateY(-4px);
      border-color: var(--card-hover-border);
      background-color: var(--card-hover-bg);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .action-card:active {
      transform: translateY(-1px);
    }

    .card-icon-container {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: var(--card-icon-badge);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      transition: transform 0.2s ease;
    }

    .action-card:hover .card-icon-container {
      transform: scale(1.08);
    }

    .card-icon {
      font-size: 26px;
      line-height: 1;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.45;
      margin: 0;
    }

    /* Mobile view */
    @media (max-width: 768px) {
      .action-grid {
        grid-template-columns: 1fr;
        max-width: 440px;
      }

      .action-card {
        padding: 20px;
        flex-direction: row;
        text-align: left;
        gap: 16px;
      }

      .card-icon-container {
        width: 48px;
        height: 48px;
        min-width: 48px;
        margin-bottom: 0;
      }

      .card-icon {
        font-size: 22px;
      }

      .main-wrapper {
        padding-top: 10px;
      }
    }
  </style>
</head>
<body>

<header class="top-bar">
  <div class="toolbar">
    <div class="lang-group" role="group" data-translate-aria-label="languageGroup" style="display:flex; gap:6px;">
      <button type="button" class="lang-btn" data-lang="en" aria-label="English" title="English">
        <svg viewBox="0 0 60 30" preserveAspectRatio="none" aria-hidden="true">
          <clipPath id="unionJackFrame"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
          <clipPath id="unionJackDiagonals"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
          <g clip-path="url(#unionJackFrame)">
            <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
            <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#unionJackDiagonals)" stroke="#C8102E" stroke-width="4"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
          </g>
        </svg>
      </button>
      <button type="button" class="lang-btn" data-lang="fr" aria-label="Français" title="Français">
        <svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true">
          <rect width="1" height="2" fill="#002654"/>
          <rect x="1" width="1" height="2" fill="#ffffff"/>
          <rect x="2" width="1" height="2" fill="#CE1126"/>
        </svg>
      </button>
      <button type="button" class="lang-btn" data-lang="uk" aria-label="Українська" title="Українська">
        <svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true">
          <rect width="3" height="1" fill="#0057B7"/>
          <rect y="1" width="3" height="1" fill="#FFD700"/>
        </svg>
      </button>
    </div>

    <button type="button" class="theme-btn" id="themeToggle" data-translate-aria-label="themeButtonLabel" data-translate-title="themeButtonLabel">
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>
</header>

<main class="main-wrapper">
  <div class="container">
    <div class="header-section">
      <img src="/images_temporary/logo.png" alt="Logo" class="logo">
      <h1 data-translate="heading">Dashboard</h1>
      <p class="greeting" data-translate="greeting">Hello, User!</p>
    </div>

    <div class="action-grid">
      <div class="action-card" onclick="window.location.href='previous_reports.html'">
        <div class="card-icon-container">
          <span class="card-icon">📅</span>
        </div>
        <div class="card-content">
          <div class="card-title" data-translate="btnHistory">View Report History</div>
          <p class="card-desc" data-translate="descHistory">Browse and review past work hours and generated logs.</p>
        </div>
      </div>

      <div class="action-card" onclick="window.location.href='settings.html'">
        <div class="card-icon-container">
          <span class="card-icon">⚙️</span>
        </div>
        <div class="card-content">
          <div class="card-title" data-translate="btnSettings">Manage App Settings</div>
          <p class="card-desc" data-translate="descSettings">Configure account parameters, default rates, and HST.</p>
        </div>
      </div>

      <div class="action-card" onclick="window.location.href='newReportTab.html'">
        <div class="card-icon-container">
          <span class="card-icon">➕</span>
        </div>
        <div class="card-content">
          <div class="card-title" data-translate="btnGenerate">Generate New Report</div>
          <p class="card-desc" data-translate="descGenerate">Record hours, assign addresses, and export report files.</p>
        </div>
      </div>
    </div>
  </div>
</main>

<script type="module" src="../JavaScript/dashboard/dashboard-theme-language.js"></script>
</body>
</html>
