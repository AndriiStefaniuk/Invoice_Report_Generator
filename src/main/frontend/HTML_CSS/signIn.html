<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="pageTitle">Sign In - Chuhax</title>
  <script>
    try {
      var savedTheme = localStorage.getItem("theme");
      if (!savedTheme) {
        savedTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", savedTheme);
    } catch (e) {}
  </script>
  <style>
    :root {
      --bg-color: #E8DECF;
      --primary-blue: #0B2A4A;
      --card-bg: rgba(255, 255, 255, 0.45);
      --border-color: #5A6D80;
      --border-light: rgba(90, 109, 128, 0.25);
      --input-bg: rgba(255, 255, 255, 0.55);
      --input-text: #0B2A4A;
      --input-placeholder: #5A6D80;
      --text-muted: #4A5B6D;
      --btn-submit-bg: #0B2A4A;
      --btn-submit-text: #ffffff;
      --btn-submit-hover-bg: #081f38;
      --btn-secondary-border: #0B2A4A;
      --btn-secondary-text: #0B2A4A;
      --btn-secondary-hover-bg: rgba(11, 42, 74, 0.08);
      --eye-icon-color: #5A6D80;
      --error-bg: rgba(179, 38, 30, 0.12);
      --error-border: #B3261E;
      --error-text: #B3261E;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg-color: #101820;
      --primary-blue: #E8DECF;
      --card-bg: rgba(255, 255, 255, 0.04);
      --border-color: #7F93A8;
      --border-light: rgba(127, 147, 168, 0.2);
      --input-bg: rgba(255, 255, 255, 0.07);
      --input-text: #E8DECF;
      --input-placeholder: #7F93A8;
      --text-muted: #B5C2CF;
      --btn-submit-bg: rgba(232, 222, 207, 0.12);
      --btn-submit-text: #E8DECF;
      --btn-submit-hover-bg: rgba(232, 222, 207, 0.22);
      --btn-secondary-border: #7F93A8;
      --btn-secondary-text: #E8DECF;
      --btn-secondary-hover-bg: rgba(232, 222, 207, 0.08);
      --eye-icon-color: #B5C2CF;
      --error-bg: rgba(255, 107, 107, 0.12);
      --error-border: #FF6B6B;
      --error-text: #FF8F8F;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--primary-blue);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top navigation toolbar */
    .top-bar {
      width: 100%;
      padding: 18px 24px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar button {
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 3px;
      height: 28px;
      color: var(--primary-blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease;
    }

    .toolbar button:hover {
      border-color: var(--primary-blue);
    }

    .lang-btn {
      width: 38px;
    }

    .lang-btn svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 3px;
    }

    .lang-btn[aria-pressed="true"] {
      outline: 2px solid var(--primary-blue);
      outline-offset: 1px;
    }

    .theme-btn {
      width: 34px;
      margin-left: 4px;
    }

    .theme-btn .icon-sun { display: none; }
    :root[data-theme="dark"] .theme-btn .icon-sun { display: block; }
    :root[data-theme="dark"] .theme-btn .icon-moon { display: none; }

    /* Main Container */
    .main-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 24px 60px 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      max-width: 140px;
      height: auto;
      object-fit: contain;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      margin: 0 0 30px 0;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .form-container {
      width: 100%;
    }

    .form-group {
      margin-bottom: 16px;
      width: 100%;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background-color: var(--input-bg);
      color: var(--input-text);
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
      font-family: inherit;
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder {
      color: var(--input-placeholder);
      opacity: 1;
    }

    input:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 1px var(--primary-blue);
    }

    /* Password Input Wrapper with Eye Button */
    .password-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .password-wrapper input {
      padding-right: 48px;
    }

    .toggle-password-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--eye-icon-color);
      transition: color 0.2s ease;
    }

    .toggle-password-btn:hover {
      color: var(--primary-blue);
    }

    .toggle-password-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-eye-off {
      display: none;
    }

    .password-visible .icon-eye {
      display: none;
    }

    .password-visible .icon-eye-off {
      display: block;
    }

    /* Custom Message Box */
    .auth-message-box {
      display: none;
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      line-height: 1.4;
      text-align: center;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      margin-top: 6px;
      background-color: var(--btn-submit-bg);
      color: var(--btn-submit-text);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid var(--border-color);
      border-radius: 28px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transition: background-color 0.2s ease, transform 0.1s ease, border-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: var(--btn-submit-hover-bg);
      border-color: var(--primary-blue);
    }

    .btn-submit:active {
      transform: translateY(2px);
    }

    .forgot-password {
      margin-top: 18px;
      font-size: 14px;
      color: var(--text-muted);
      text-decoration: underline;
      cursor: pointer;
      text-align: center;
      width: 100%;
      display: block;
      transition: color 0.2s ease;
    }

    .forgot-password:hover {
      color: var(--primary-blue);
    }

    .create-account-container {
      margin-top: 45px;
      width: 100%;
      text-align: center;
      border-top: 1px solid var(--border-light);
      padding-top: 25px;
    }

    .no-account-text {
      font-size: 14px;
      color: var(--text-muted);
      display: block;
      margin-bottom: 14px;
    }

    .btn-secondary {
      width: 100%;
      padding: 14px;
      background-color: transparent;
      color: var(--btn-secondary-text);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid var(--btn-secondary-border);
      border-radius: 28px;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .btn-secondary:hover {
      background-color: var(--btn-secondary-hover-bg);
      border-color: var(--primary-blue);
    }

    .btn-secondary:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

<header class="top-bar">
  <div class="toolbar">
    <div class="lang-group" role="group" data-translate-aria-label="languageGroup" style="display:flex; gap:6px;">
      <button type="button" class="lang-btn" data-lang="en" aria-label="English" title="English">
        <svg viewBox="0 0 60 30" preserveAspectRatio="none" aria-hidden="true">
          <clipPath id="unionJackFrame"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
          <clipPath id="unionJackDiagonals"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
          <g clip-path="url(#unionJackFrame)">
            <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
            <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#unionJackDiagonals)" stroke="#C8102E" stroke-width="4"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
          </g>
        </svg>
      </button>
      <button type="button" class="lang-btn" data-lang="fr" aria-label="Français" title="Français">
        <svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true">
          <rect width="1" height="2" fill="#002654"/>
          <rect x="1" width="1" height="2" fill="#ffffff"/>
          <rect x="2" width="1" height="2" fill="#CE1126"/>
        </svg>
      </button>
      <button type="button" class="lang-btn" data-lang="uk" aria-label="Українська" title="Українська">
        <svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true">
          <rect width="3" height="1" fill="#0057B7"/>
          <rect y="1" width="3" height="1" fill="#FFD700"/>
        </svg>
      </button>
    </div>

    <button type="button" class="theme-btn" id="themeToggle" data-translate-aria-label="themeButtonLabel" data-translate-title="themeButtonLabel">
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>
</header>

<main class="main-wrapper">
  <div class="container">
    <div class="logo-container">
      <img src="/images_temporary/logo.png" alt="Logo" class="logo">
    </div>

    <h1 data-translate="heading">Report Manager Log In</h1>

    <div class="form-container">
      <div class="form-group">
        <input type="text" id="usernameInput" name="username" data-translate-placeholder="usernamePlaceholder" placeholder="Email or Username">
      </div>

      <div class="form-group">
        <div class="password-wrapper">
          <input type="password" id="passwordInput" name="password" data-translate-placeholder="passwordPlaceholder" placeholder="Password">
          <button type="button" class="toggle-password-btn" id="togglePasswordBtn" data-translate-aria-label="togglePasswordAria" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Custom Dynamic Feedback Area -->
      <div class="auth-message-box" id="authMessageBox" role="alert"></div>

      <button type="button" class="btn-submit" id="submitLoginBtn" data-translate="btnLogin">Log In</button>

      <a href="#" class="forgot-password" id="forgotPasswordLink" data-translate="forgotPassword">Forgot Password?</a>
    </div>

    <div class="create-account-container">
      <span class="no-account-text" data-translate="noAccountText">Don't have an account?</span>
      <button type="button" class="btn-secondary" onclick="window.location.href='signup.html'" data-translate="btnCreateAccount">Create New Account</button>
    </div>
  </div>
</main>

<script type="module" src="../JavaScript/authorization/signin-theme-language.js"></script>
</body>
</html>
