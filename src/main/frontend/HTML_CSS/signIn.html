<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Chuhax</title>
  <style>
    :root {
        --bg-color: #E8DECF;
        --primary-blue: #0B2A4A;
        --input-bg: rgba(255, 255, 255, 0.4);
        --border-color: #5A6D80;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--primary-blue);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        width: 100%;
        max-width: 400px;
        padding: 40px 20px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .logo-container {
        text-align: center;
        margin-bottom: 15px;
    }

    .logo {
        max-width: 140px;
        height: auto;
        object-fit: contain;
    }

    h1 {
        text-align: center;
        font-size: 22px;
        margin-bottom: 35px;
        font-weight: 600;
    }

    .form-group {
        margin-bottom: 16px;
        width: 100%;
    }

    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 14px 16px;
        font-size: 15px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background-color: var(--input-bg);
        color: #333;
        box-sizing: border-box;
        outline: none;
        transition: border-color 0.2s ease;
    }

    input:focus {
        border-color: var(--primary-blue);
        border-width: 2px;
        padding: 13px 15px;
    }

    .btn-submit {
        width: 100%;
        padding: 16px;
        margin-top: 10px;
        background-color: var(--primary-blue);
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(11, 42, 74, 0.2);
        transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
        background-color: #081f38;
    }

    .btn-submit:active {
        transform: translateY(2px);
        box-shadow: 0 2px 4px rgba(11, 42, 74, 0.2);
    }

    .forgot-password {
        margin-top: 15px;
        font-size: 14px;
        color: var(--primary-blue);
        text-decoration: underline;
        cursor: pointer;
        text-align: center;
        width: 100%;
        display: block;
    }

    .create-account-container {
        margin-top: 50px;
        width: 100%;
        text-align: center;
    }

    .btn-secondary {
        width: 100%;
        padding: 14px;
        background-color: transparent;
        color: var(--primary-blue);
        font-size: 15px;
        font-weight: 600;
        border: 1px solid var(--primary-blue);
        border-radius: 25px;
        cursor: pointer;
        transition: background-color 0.2s ease;
    }

    .btn-secondary:hover {
        background-color: rgba(11, 42, 74, 0.05);
    }

    ::placeholder {
        color: #666;
        opacity: 1;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="logo-container">
    <img src="/images_temporary/logo.png" alt="Logo" class="logo">
  </div>

  <h1>Report Manager Log In</h1>

  <form action="#" method="POST" style="width: 100%;">
    <div class="form-group">
      <input type="text" name="username" placeholder="Email or Username" required>
    </div>

    <div class="form-group">
      <input type="password" name="password" placeholder="Password" required>
    </div>

    <button type="submit" onclick="window.location.href='main.html'" class="btn-submit">Log In</button>

    <a href="#" class="forgot-password">Forgot Password?</a>
  </form>

  <div class="create-account-container">
    <span style="font-size: 14px; display: block; margin-bottom: 10px;">Don't have an account?</span>
    <button type="button" class="btn-secondary" onclick="window.location.href='signup.html'">Create New Account</button>
  </div>
</div>

</body>
</html>
