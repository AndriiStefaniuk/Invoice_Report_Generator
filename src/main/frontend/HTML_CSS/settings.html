<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="pageTitle">Settings - Chuhax</title>
  <script>
    try {
      var savedTheme = localStorage.getItem("theme");
      if (!savedTheme) {
        savedTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", savedTheme);
    } catch (e) {}
  </script>
  <style>
    :root {
      --bg-color: #E8DECF;
      --primary-blue: #0B2A4A;
      --card-bg: rgba(255, 255, 255, 0.45);
      --border-color: #5A6D80;
      --input-bg-active: rgba(255, 255, 255, 0.7);
      --text-muted: #4A5B6D;
      --btn-bg: #0B2A4A;
      --btn-text: #ffffff;
      --btn-hover: #081f38;
      --btn-save-bg: #0B2A4A;
      --btn-save-text: #ffffff;
      --btn-save-border: #0B2A4A;
      --btn-save-hover-bg: #081f38;
      --warning-red: #B3261E;
      --warning-red-hover: rgba(179, 38, 30, 0.1);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg-color: #101820;
      --primary-blue: #E8DECF;
      --card-bg: rgba(255, 255, 255, 0.05);
      --border-color: #7F93A8;
      --input-bg-active: rgba(255, 255, 255, 0.12);
      --text-muted: #B5C2CF;
      --btn-bg: #E8DECF;
      --btn-text: #0B2A4A;
      --btn-hover: #d8cdbd;
      --btn-save-bg: rgba(232, 222, 207, 0.1);
      --btn-save-text: #E8DECF;
      --btn-save-border: #7F93A8;
      --btn-save-hover-bg: rgba(232, 222, 207, 0.2);
      --warning-red: #FF6B6B;
      --warning-red-hover: rgba(255, 107, 107, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--primary-blue);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Top Navigation with Back Link and Controls */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid rgba(127, 147, 168, 0.25);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      text-decoration: none;
      color: var(--primary-blue);
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      transition: transform 0.1s ease;
    }

    .back-btn:hover {
      transform: translateX(-2px);
    }

    .nav-title {
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Toolbar for Language and Theme */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar button {
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 3px;
      height: 28px;
      color: var(--primary-blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease;
    }

    .toolbar button:hover {
      border-color: var(--primary-blue);
    }

    .lang-btn {
      width: 38px;
    }

    .lang-btn svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 3px;
    }

    .lang-btn[aria-pressed="true"] {
      outline: 2px solid var(--primary-blue);
      outline-offset: 1px;
    }

    .theme-btn {
      width: 34px;
      margin-left: 2px;
    }

    .theme-btn .icon-sun { display: none; }
    :root[data-theme="dark"] .theme-btn .icon-sun { display: block; }
    :root[data-theme="dark"] .theme-btn .icon-moon { display: none; }

    /* Content and Section Styling */
    .content {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .section-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 24px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h2 {
      font-size: 14px;
      font-weight: 800;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-edit {
      background: none;
      border: 1px solid var(--primary-blue);
      color: var(--primary-blue);
      border-radius: 12px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-edit:hover {
      background-color: rgba(127, 147, 168, 0.15);
    }

    /* Fieldset and Inputs */
    .custom-fieldset {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      margin: 0 0 14px 0;
      background-color: transparent;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .custom-fieldset:last-child {
      margin-bottom: 0;
    }

    .custom-fieldset legend {
      font-size: 12px;
      color: var(--primary-blue);
      padding: 0 5px;
      font-weight: 600;
    }

    .custom-fieldset input,
    .custom-fieldset textarea {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 15px;
      color: var(--primary-blue);
      outline: none;
      padding: 4px 0;
      font-family: inherit;
      box-sizing: border-box;
      resize: none;
    }

    .custom-fieldset input:read-only,
    .custom-fieldset textarea:read-only {
      opacity: 0.75;
      pointer-events: none;
    }

    .custom-fieldset.editing {
      background-color: var(--input-bg-active);
      border-width: 2px;
      padding: 7px 11px;
    }

    .custom-fieldset.editing input,
    .custom-fieldset.editing textarea {
      opacity: 1;
      pointer-events: auto;
    }

    /* Save Changes Button */
    .btn-save {
      width: 100%;
      padding: 16px;
      background-color: var(--btn-save-bg);
      color: var(--btn-save-text);
      border: 1px solid var(--btn-save-border);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: 28px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transition: background-color 0.2s ease, transform 0.1s ease, border-color 0.2s ease;
      margin-top: 10px;
      display: none;
      text-align: center;
    }

    .btn-save:hover {
      background-color: var(--btn-save-hover-bg);
      border-color: var(--primary-blue);
    }

    .btn-save:active {
      transform: translateY(2px);
    }

    .btn-logout {
      width: 100%;
      padding: 15px;
      background-color: transparent;
      color: var(--warning-red);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 2px solid var(--warning-red);
      border-radius: 28px;
      cursor: pointer;
      margin-top: 16px;
      transition: background-color 0.2s ease;
    }

    .btn-logout:hover {
      background-color: var(--warning-red-hover);
    }

    @media (max-width: 480px) {
      .top-nav {
        padding: 14px 16px;
      }
      .content {
        padding: 16px;
      }
    }
  </style>
</head>
<body>

<div class="app-container">

  <header class="top-nav">
    <div class="nav-left">
      <a href="main.html" class="back-btn" data-translate-aria-label="backButtonAria" aria-label="Back to Dashboard">&larr;</a>
      <div class="nav-title" data-translate="pageHeading">Settings</div>
    </div>

    <div class="toolbar">
      <div class="lang-group" role="group" data-translate-aria-label="languageGroup" style="display:flex; gap:6px;">
        <button type="button" class="lang-btn" data-lang="en" aria-label="English" title="English">
          <svg viewBox="0 0 60 30" preserveAspectRatio="none" aria-hidden="true">
            <clipPath id="unionJackFrame"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
            <clipPath id="unionJackDiagonals"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
            <g clip-path="url(#unionJackFrame)">
              <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
              <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
              <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#unionJackDiagonals)" stroke="#C8102E" stroke-width="4"/>
              <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
              <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
            </g>
          </svg>
        </button>
        <button type="button" class="lang-btn" data-lang="fr" aria-label="Français" title="Français">
          <svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true">
            <rect width="1" height="2" fill="#002654"/>
            <rect x="1" width="1" height="2" fill="#ffffff"/>
            <rect x="2" width="1" height="2" fill="#CE1126"/>
          </svg>
        </button>
        <button type="button" class="lang-btn" data-lang="uk" aria-label="Українська" title="Українська">
          <svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true">
            <rect width="3" height="1" fill="#0057B7"/>
            <rect y="1" width="3" height="1" fill="#FFD700"/>
          </svg>
        </button>
      </div>

      <button type="button" class="theme-btn" id="themeToggle" data-translate-aria-label="themeButtonLabel" data-translate-title="themeButtonLabel">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="content">

    <div class="section-card">
      <div class="section-header">
        <h2 data-translate="profileSectionHeader">Profile Details</h2>
        <button type="button" class="btn-edit" id="btnEditProfile" data-translate="btnEdit">EDIT</button>
      </div>

      <fieldset class="custom-fieldset" id="fs-fullName">
        <legend data-translate="legendFullName">Full Name</legend>
        <input type="text" id="fullName" value="Andrii Stefaniuk" readonly>
      </fieldset>

      <fieldset class="custom-fieldset" id="fs-homeAddress">
        <legend data-translate="legendHomeAddress">Home/Business Address</legend>
        <textarea id="homeAddress" rows="2" readonly>123 Mississauga Rd&#10;Mississauga, ON L5A 1V9</textarea>
      </fieldset>
    </div>

    <div class="section-card">
      <div class="section-header">
        <h2 data-translate="billingSectionHeader">Billing & Tax</h2>
        <button type="button" class="btn-edit" id="btnEditBilling" data-translate="btnEdit">EDIT</button>
      </div>

      <fieldset class="custom-fieldset" id="fs-hstNumber">
        <legend data-translate="legendHstNumber">HST Number</legend>
        <input type="text" id="hstNumber" value="123456789 RT0001" readonly>
      </fieldset>

      <fieldset class="custom-fieldset" id="fs-hourlyRate">
        <legend data-translate="legendHourlyRate">Default Hourly Rate ($)</legend>
        <input type="number" id="hourlyRate" step="0.10" value="100.00" readonly>
      </fieldset>
    </div>

    <button type="button" class="btn-save" id="saveButton" data-translate="btnSave">SAVE CHANGES</button>
    <button type="button" class="btn-logout" data-translate="btnLogout">LOG OUT</button>

  </main>
</div>

<script type="module" src="../JavaScript/settings/settings-theme-language.js"></script>
</body>
</html>
