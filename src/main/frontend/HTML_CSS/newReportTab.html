<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="pageTitle">Create Report - Chuhax</title>
  <script>
    try {
      var savedTheme = localStorage.getItem("theme");
      if (!savedTheme) {
        savedTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", savedTheme);
    } catch (e) {}
  </script>
  <style>
    :root {
      --bg-color: #E8DECF;
      --primary-blue: #0B2A4A;
      --card-bg: rgba(255, 255, 255, 0.45);
      --border-color: #5A6D80;
      --border-light: rgba(90, 109, 128, 0.25);
      --input-bg-active: rgba(255, 255, 255, 0.7);
      --text-muted: #4A5B6D;
      --btn-bg: #0B2A4A;
      --btn-text: #ffffff;
      --btn-hover: #081f38;
      --btn-action-bg: #0B2A4A;
      --btn-action-text: #ffffff;
      --btn-action-border: #0B2A4A;
      --btn-action-hover-bg: #081f38;
      --accent-pill: rgba(11, 42, 74, 0.08);
      --warning-red: #B3261E;
      --warning-red-hover: rgba(179, 38, 30, 0.12);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg-color: #101820;
      --primary-blue: #E8DECF;
      --card-bg: rgba(255, 255, 255, 0.05);
      --border-color: #7F93A8;
      --border-light: rgba(127, 147, 168, 0.2);
      --input-bg-active: rgba(255, 255, 255, 0.12);
      --text-muted: #B5C2CF;
      --btn-bg: #E8DECF;
      --btn-text: #0B2A4A;
      --btn-hover: #d8cdbd;
      --btn-action-bg: rgba(232, 222, 207, 0.1);
      --btn-action-text: #E8DECF;
      --btn-action-border: #7F93A8;
      --btn-action-hover-bg: rgba(232, 222, 207, 0.2);
      --accent-pill: rgba(232, 222, 207, 0.12);
      --warning-red: #FF6B6B;
      --warning-red-hover: rgba(255, 107, 107, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--primary-blue);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Top Navigation */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-light);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      text-decoration: none;
      color: var(--primary-blue);
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      transition: transform 0.1s ease;
    }

    .back-btn:hover {
      transform: translateX(-2px);
    }

    .nav-title {
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar button {
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 3px;
      height: 28px;
      color: var(--primary-blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease;
    }

    .toolbar button:hover {
      border-color: var(--primary-blue);
    }

    .lang-btn {
      width: 38px;
    }

    .lang-btn svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 3px;
    }

    .lang-btn[aria-pressed="true"] {
      outline: 2px solid var(--primary-blue);
      outline-offset: 1px;
    }

    .theme-btn {
      width: 34px;
      margin-left: 2px;
    }

    .theme-btn .icon-sun { display: none; }
    :root[data-theme="dark"] .theme-btn .icon-sun { display: block; }
    :root[data-theme="dark"] .theme-btn .icon-moon { display: none; }

    /* Content Area */
    .content {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 20px;
    }

    .section-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.75px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    /* Fieldsets */
    .custom-fieldset {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      margin: 0 0 14px 0;
      background-color: transparent;
      transition: border-color 0.2s ease;
    }

    .custom-fieldset:last-child {
      margin-bottom: 0;
    }

    .custom-fieldset legend {
      font-size: 12px;
      color: var(--primary-blue);
      padding: 0 5px;
      font-weight: 600;
    }

    .custom-fieldset input {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 15px;
      color: var(--primary-blue);
      outline: none;
      padding: 4px 0;
      font-family: inherit;
      box-sizing: border-box;
    }

    .custom-fieldset input[type="date"] {
      cursor: pointer;
    }

    /* Site Row Input */
    .site-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-add-site {
      background-color: var(--btn-action-bg);
      color: var(--btn-action-text);
      border: 1px solid var(--btn-action-border);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .btn-add-site:hover {
      background-color: var(--btn-action-hover-bg);
      border-color: var(--primary-blue);
    }

    /* Sites List */
    .added-sites-box {
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 14px;
      margin-top: 14px;
      background-color: var(--accent-pill);
    }

    .added-sites-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--primary-blue);
      letter-spacing: 0.5px;
    }

    .site-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .site-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 500;
      padding: 4px 0;
      border-bottom: 1px solid var(--border-light);
    }

    .site-list li:last-child {
      border-bottom: none;
    }

    .site-text-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .remove-site-btn {
      background: none;
      border: none;
      color: var(--warning-red);
      cursor: pointer;
      font-weight: 800;
      font-size: 16px;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 4px;
      transition: background-color 0.15s ease;
    }

    .remove-site-btn:hover {
      background-color: var(--warning-red-hover);
    }

    /* Main Action Button */
    .btn-generate {
      width: 100%;
      padding: 16px;
      background-color: var(--btn-action-bg);
      color: var(--btn-action-text);
      border: 1px solid var(--btn-action-border);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: 28px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transition: background-color 0.2s ease, transform 0.1s ease, border-color 0.2s ease;
      margin-top: 8px;
    }

    .btn-generate:hover {
      background-color: var(--btn-action-hover-bg);
      border-color: var(--primary-blue);
    }

    .btn-generate:active {
      transform: translateY(2px);
    }

    @media (max-width: 480px) {
      .top-nav {
        padding: 14px 16px;
      }
      .content {
        padding: 16px;
      }
    }
  </style>
</head>
<body>

<div class="app-container">

  <header class="top-nav">
    <div class="nav-left">
      <a href="main.html" class="back-btn" data-translate-aria-label="backButtonAria" aria-label="Back to Dashboard">&larr;</a>
      <div class="nav-title" data-translate="navTitle">Create Report</div>
    </div>

    <div class="toolbar">
      <div class="lang-group" role="group" data-translate-aria-label="languageGroup" style="display:flex; gap:6px;">
        <button type="button" class="lang-btn" data-lang="en" aria-label="English" title="English">
          <svg viewBox="0 0 60 30" preserveAspectRatio="none" aria-hidden="true">
            <clipPath id="unionJackFrame"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
            <clipPath id="unionJackDiagonals"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
            <g clip-path="url(#unionJackFrame)">
              <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
              <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
              <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#unionJackDiagonals)" stroke="#C8102E" stroke-width="4"/>
              <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
              <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
            </g>
          </svg>
        </button>
        <button type="button" class="lang-btn" data-lang="fr" aria-label="Français" title="Français">
          <svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true">
            <rect width="1" height="2" fill="#002654"/>
            <rect x="1" width="1" height="2" fill="#ffffff"/>
            <rect x="2" width="1" height="2" fill="#CE1126"/>
          </svg>
        </button>
        <button type="button" class="lang-btn" data-lang="uk" aria-label="Українська" title="Українська">
          <svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true">
            <rect width="3" height="1" fill="#0057B7"/>
            <rect y="1" width="3" height="1" fill="#FFD700"/>
          </svg>
        </button>
      </div>

      <button type="button" class="theme-btn" id="themeToggle" data-translate-aria-label="themeButtonLabel" data-translate-title="themeButtonLabel">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="content">

    <!-- Report Dates Card -->
    <div class="section-card">
      <div class="section-label" data-translate="datesSectionLabel">Report Date Range</div>

      <fieldset class="custom-fieldset">
        <legend data-translate="legendStartDate">Report Start Date</legend>
        <input type="date" id="reportStartDate" value="2026-10-01">
      </fieldset>

      <fieldset class="custom-fieldset">
        <legend data-translate="legendEndDate">Report End Date</legend>
        <input type="date" id="reportEndDate" value="2026-10-14">
      </fieldset>
    </div>

    <!-- Site Addresses Card -->
    <div class="section-card">
      <div class="section-label" data-translate="sitesSectionLabel">Site Address(es)</div>

      <fieldset class="custom-fieldset">
        <legend data-translate="legendSiteAddress">New Site Address</legend>
        <div class="site-input-row">
          <input type="text" id="siteAddressInput" data-translate-placeholder="siteAddressPlaceholder" placeholder="Enter a site address...">
          <button type="button" class="btn-add-site" id="btnAddSite" data-translate="btnAddSite">ADD SITE</button>
        </div>
      </fieldset>

      <div class="added-sites-box">
        <div class="added-sites-title" data-translate="addedSitesTitle">Added Sites:</div>
        <ul class="site-list" id="addedSitesList">
          <!-- Rendered dynamically -->
        </ul>
      </div>
    </div>

    <!-- Hours Breakdown Card -->
    <div class="section-card">
      <div class="section-label" data-translate="hoursSectionLabel">Weekly Hours Worked</div>

      <fieldset class="custom-fieldset">
        <legend data-translate="legendWeekOneHours">Hours Worked: Week 1</legend>
        <input type="number" id="weekOneHoursInput" step="0.01" min="0" placeholder="0.00">
      </fieldset>

      <fieldset class="custom-fieldset">
        <legend data-translate="legendWeekTwoHours">Hours Worked: Week 2</legend>
        <input type="number" id="weekTwoHoursInput" step="0.01" min="0" placeholder="0.00">
      </fieldset>
    </div>

    <!-- Action Button -->
    <button type="button" class="btn-generate" id="generateReportButton" data-translate="btnGenerate">GENERATE EXCEL REPORT</button>

  </main>
</div>

<script type="module" src="../JavaScript/reports/create-report-theme-language.js"></script>
</body>
</html>
