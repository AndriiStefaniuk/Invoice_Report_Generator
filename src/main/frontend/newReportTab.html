<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Report - Chuhax</title>
  <style>
    :root {
        --bg-color: #E8DECF;
        --primary-blue: #0B2A4A;
        --input-bg: rgba(255, 255, 255, 0.4);
        --border-color: #0B2A4A;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--primary-blue);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
    }

    .app-container {
        width: 100%;
        max-width: 480px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        background-color: var(--bg-color);
        min-height: 100vh;
        position: relative;
    }

    /* Top Navigation Bar */
    .top-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        border-bottom: 1px solid rgba(11, 42, 74, 0.1);
        margin-bottom: 20px;
    }

    .top-nav a {
        text-decoration: none;
        color: var(--primary-blue);
        font-size: 24px;
        font-weight: bold;
    }

    .nav-title {
        font-size: 18px;
        font-weight: 500;
    }

    .user-icon {
        font-size: 22px;
    }

    /* Main Content Container */
    .content {
        padding: 0 20px 40px 20px;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
    }

    h1 {
        font-size: 24px;
        font-weight: 800;
        margin: 0 0 25px 0;
        text-transform: uppercase;
        text-align: center;
    }

    h2 {
        font-size: 16px;
        font-weight: 800;
        margin: 30px 0 15px 0;
        text-transform: uppercase;
    }

    /* Input Styling using Fieldset for embedded labels */
    .custom-fieldset {
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 5px 12px 10px 12px;
        margin: 0 0 20px 0;
        background-color: transparent;
    }

    .custom-fieldset legend {
        font-size: 13px;
        color: var(--primary-blue);
        padding: 0 5px;
        font-weight: 500;
    }

    .custom-fieldset input {
        width: 100%;
        border: none;
        background: transparent;
        font-size: 16px;
        color: var(--primary-blue);
        outline: none;
        padding: 5px 0;
        font-family: inherit;
    }

    .custom-fieldset input[type="date"] {
        cursor: pointer;
    }

    /* Site Address specific layout */
    .site-input-row {
        display: flex;
        gap: 12px;
        align-items: center;
    }

    .btn-add-site {
        background-color: var(--primary-blue);
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        transition: background-color 0.2s ease;
    }

    .btn-add-site:hover {
        background-color: #081f38;
    }

    .added-sites-box {
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 25px;
        background-color: rgba(11, 42, 74, 0.05);
    }

    .added-sites-title {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 10px;
    }

    .site-list {
        list-style: none;
        padding: 0;
        margin: 0;
        font-size: 15px;
    }

    .site-list li {
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .site-list li:last-child {
        margin-bottom: 0;
    }

    .remove-site {
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
    }

    /* Main Action Button */
    .btn-generate {
        width: 100%;
        padding: 18px 20px;
        background-color: var(--primary-blue);
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        text-transform: uppercase;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(11, 42, 74, 0.2);
        transition: background-color 0.2s ease, transform 0.1s ease;
        margin-top: 20px;
    }

    .btn-generate:hover {
        background-color: #081f38;
    }

    .btn-generate:active {
        transform: translateY(2px);
        box-shadow: 0 2px 4px rgba(11, 42, 74, 0.2);
    }

  </style>
</head>
<body>

<div class="app-container">

  <!-- Top Navigation -->
  <div class="top-nav">
    <a href="dashboard.html">&larr;</a>
    <div class="nav-title">Create Report</div>
    <div class="user-icon">&#128100;</div>
  </div>

  <!-- Main Form Content -->
  <div class="content">
    <h1>NEW HST REPORT</h1>

    <!-- Dates -->
    <fieldset class="custom-fieldset">
      <legend>Report Start Date</legend>
      <input type="date" value="2026-10-01">
    </fieldset>

    <fieldset class="custom-fieldset">
      <legend>Report End Date</legend>
      <input type="date" value="2026-10-14">
    </fieldset>

    <!-- Site Address Section -->
    <fieldset class="custom-fieldset">
      <legend>Site Address</legend>
      <div class="site-input-row">
        <input type="text" placeholder="Enter a site address...">
        <button type="button" class="btn-add-site">ADD SITE</button>
      </div>
    </fieldset>

    <div class="added-sites-box">
      <div class="added-sites-title">Added Sites:</div>
      <ul class="site-list">
        <li>- 123 Mississauga Rd <span class="remove-site">[X]</span></li>
        <li>- 456 Oak Ave, Toronto <span class="remove-site">[X]</span></li>
        <li>- 789 Pine St, Kitchener <span class="remove-site">[X]</span></li>
      </ul>
    </div>

    <!-- Hours Breakdown -->
    <h2>WEEKLY HOURS WORKED</h2>

    <fieldset class="custom-fieldset">
      <legend>Hours Worked: Week 1</legend>
      <input type="number" step="0.01" min="0" placeholder="0.00">
    </fieldset>

    <fieldset class="custom-fieldset">
      <legend>Hours Worked: Week 2</legend>
      <input type="number" step="0.01" min="0" placeholder="0.00">
    </fieldset>

    <!-- Submission -->
    <button type="button" class="btn-generate">GENERATE EXCEL REPORT</button>
  </div>

</div>

</body>
</html>
