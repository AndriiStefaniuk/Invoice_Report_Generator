<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Chuhax</title>
  <style>
    :root {
        --bg-color: #E8DECF;
        --primary-blue: #0B2A4A;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--primary-blue);
        display: flex;
        justify-content: center;
        align-items: flex-start; /* Changed from center to flex-start to push content to the top */
        min-height: 100vh;
    }

    .container {
        width: 100%;
        max-width: 400px;
        padding: 80px 20px 40px 20px; /* Added 80px top padding so it doesn't hug the very edge of the screen */
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .header-section {
        text-align: center;
        width: 100%;
        margin-bottom: 50px;
    }

    .logo {
        max-width: 200px;
        height: auto;
        object-fit: contain;
        margin-bottom: 30px;
    }

    h1 {
        font-size: 24px;
        margin: 0 0 15px 0;
        font-weight: 700;
    }

    .greeting {
        font-size: 18px;
        margin: 0;
        font-weight: 500;
        text-align: left;
        width: 100%;
        padding-left: 10px;
        box-sizing: border-box;
    }

    .button-group {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .btn-action {
        width: 100%;
        padding: 18px 20px;
        background-color: var(--primary-blue);
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(11, 42, 74, 0.2);
        transition: background-color 0.2s ease, transform 0.1s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .btn-action:hover {
        background-color: #081f38;
    }

    .btn-action:active {
        transform: translateY(2px);
        box-shadow: 0 2px 4px rgba(11, 42, 74, 0.2);
    }

    .icon-history::before {
        content: "📅";
        font-size: 18px;
    }

    .icon-settings::before {
        content: "⚙️";
        font-size: 18px;
    }

    .icon-generate::before {
        content: "+";
        font-size: 22px;
        font-weight: bold;
        line-height: 0.8;
    }

  </style>
</head>
<body>

<div class="container">
  <div class="header-section">
    <img src="/images_temporary/logo.png" alt="Logo" class="logo">
    <h1>Dashboard</h1>
    <p class="greeting">Hello, User!</p>
  </div>

  <div class="button-group">
    <button class="btn-action icon-history" onclick="window.location.href='history.html'">
      View Report History
    </button>

    <button class="btn-action icon-settings" onclick="window.location.href='settings.html'">
      Manage App Settings
    </button>

    <button class="btn-action icon-generate" onclick="window.location.href='create.html'">
      Generate New Report
    </button>
  </div>
</div>

</body>
</html>
